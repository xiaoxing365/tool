<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>robots.txt 生成器 - 小兴365</title>
<meta name="description" content="勾一下要屏蔽的目录，生成一份能直接用的 robots.txt。">
<style>
  :root {
    --bg: #fff; --fg: #1a1a1a; --muted: #6b7280; --border: #e5e7eb;
    --accent: #2563eb; --hover-bg: #f9fafb; --input-bg: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111; --fg: #e5e5e5; --muted: #8a8a8a; --border: #262626;
      --accent: #60a5fa; --hover-bg: #1a1a1a; --input-bg: #1a1a1a;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.6;
    font-size: 15px; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 0 20px; }
  header { padding: 40px 0 28px; border-bottom: 1px solid var(--border); }
  header a { color: var(--muted); text-decoration: none; font-size: 13px; }
  header a:hover { color: var(--fg); }
  header h1 { font-size: 20px; font-weight: 600; margin-top: 14px; letter-spacing: -0.3px; }
  header p { color: var(--muted); font-size: 14px; margin-top: 6px; }
  main { padding: 28px 0 40px; }
  .section-label { font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 22px; margin-bottom: 10px; }
  .section-label:first-child { margin-top: 0; }
  .checkbox-list { display: flex; flex-direction: column; gap: 8px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
  .checkbox-row label { font-size: 14px; color: var(--fg); font-weight: 400; margin: 0; }
  .checkbox-row code { font-size: 12px; color: var(--muted); font-family: "SF Mono", Consolas, monospace; }
  input[type="text"], textarea {
    width: 100%; padding: 10px 12px; font-size: 14px; font-family: inherit;
    background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--fg); outline: none;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; font-family: "SF Mono", Consolas, monospace; font-size: 13px; }
  .output { margin-top: 28px; }
  .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .label-row span.label { font-size: 13px; font-weight: 500; color: var(--muted); }
  .copy-btn {
    font-size: 12px; padding: 3px 10px; border: 1px solid var(--border);
    border-radius: 5px; background: var(--bg); color: var(--fg); cursor: pointer;
    font-family: inherit;
  }
  .copy-btn:hover { background: var(--hover-bg); }
  pre {
    background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; font-size: 13px; overflow-x: auto; white-space: pre;
    font-family: "SF Mono", Consolas, monospace; line-height: 1.6;
  }
  footer { padding: 20px 0 60px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--border); }
  footer a:hover { color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="/">← 回首页</a>
    <h1>robots.txt 生成器</h1>
    <p>勾一下要屏蔽的目录，生成一份能直接用的 robots.txt。</p>
  </header>

  <main>
    <div class="section-label">屏蔽常见目录</div>
    <div class="checkbox-list">
      <div class="checkbox-row"><input type="checkbox" id="css"><label for="css">CSS 目录 <code>/css/</code></label></div>
      <div class="checkbox-row"><input type="checkbox" id="js"><label for="js">JS 目录 <code>/js/</code></label></div>
      <div class="checkbox-row"><input type="checkbox" id="images"><label for="images">图片目录 <code>/images/</code></label></div>
      <div class="checkbox-row"><input type="checkbox" id="fonts"><label for="fonts">字体目录 <code>/fonts/</code></label></div>
      <div class="checkbox-row"><input type="checkbox" id="assets"><label for="assets">资源目录 <code>/assets/</code></label></div>
    </div>

    <div class="section-label">自定义屏蔽路径（可选）</div>
    <textarea id="customPaths" placeholder="/admin/&#10;/private/&#10;每行一个"></textarea>

    <div class="section-label">Sitemap 地址（可选）</div>
    <input type="text" id="sitemap" placeholder="https://xiaoxing365.top/sitemap.xml" autocomplete="off">

    <div class="output">
      <div class="label-row">
        <span class="label">生成的 robots.txt</span>
        <button class="copy-btn" id="copyBtn">复制</button>
      </div>
      <pre id="output">User-agent: *</pre>
    </div>
  </main>

  <footer>
    工具由 <a href="https://xiaoxing365.com/">小兴365</a> 维护 · <a href="/">回首页</a>
  </footer>
</div>

<script>
  var ids = ['css', 'js', 'images', 'fonts', 'assets'];
  var paths = { css: '/css/', js: '/js/', images: '/images/', fonts: '/fonts/', assets: '/assets/' };
  var customPaths = document.getElementById('customPaths');
  var sitemap = document.getElementById('sitemap');
  var output = document.getElementById('output');

  function update() {
    var lines = ['User-agent: *'];

    ids.forEach(function(id) {
      if (document.getElementById(id).checked) {
        lines.push('Disallow: ' + paths[id]);
      }
    });

    var custom = customPaths.value.trim();
    if (custom) {
      custom.split('\n').forEach(function(p) {
        p = p.trim();
        if (p) {
          if (p.indexOf('/') !== 0) p = '/' + p;
          lines.push('Disallow: ' + p);
        }
      });
    }

    if (!lines.some(function(l) { return l.indexOf('Disallow') === 0; })) {
      lines.push('Allow: /');
    }

    var sm = sitemap.value.trim();
    if (sm) {
      if (sm.indexOf('http') !== 0) sm = 'https://' + sm;
      lines.push('');
      lines.push('Sitemap: ' + sm);
    }

    output.textContent = lines.join('\n');
  }

  ids.forEach(function(id) {
    document.getElementById(id).addEventListener('change', update);
  });
  customPaths.addEventListener('input', update);
  sitemap.addEventListener('input', update);

  document.getElementById('copyBtn').addEventListener('click', function() {
    var text = output.textContent;
    var btn = this;
    navigator.clipboard.writeText(text).then(function() {
      btn.textContent = '已复制';
      setTimeout(function() { btn.textContent = '复制'; }, 1500);
    }).catch(function() {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      btn.textContent = '已复制';
      setTimeout(function() { btn.textContent = '复制'; }, 1500);
    });
  });

  update();
</script>
</body>
</html>
