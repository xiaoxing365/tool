<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 格式化 - 小兴365</title>
<meta name="description" content="把 JSON 格式化或压缩，方便查看和复制。">
<style>
  :root {
    --bg: #fff; --fg: #1a1a1a; --muted: #6b7280; --border: #e5e7eb;
    --accent: #2563eb; --hover-bg: #f9fafb; --input-bg: #fafafa; --error: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111; --fg: #e5e5e5; --muted: #8a8a8a; --border: #262626;
      --accent: #60a5fa; --hover-bg: #1a1a1a; --input-bg: #1a1a1a; --error: #f87171;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.6;
    font-size: 15px; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  header { padding: 40px 0 28px; border-bottom: 1px solid var(--border); }
  header a { color: var(--muted); text-decoration: none; font-size: 13px; }
  header a:hover { color: var(--fg); }
  header h1 { font-size: 20px; font-weight: 600; margin-top: 14px; letter-spacing: -0.3px; }
  header p { color: var(--muted); font-size: 14px; margin-top: 6px; }
  main { padding: 28px 0 40px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  textarea, select {
    width: 100%; padding: 10px 12px; font-size: 13px; font-family: "SF Mono", Consolas, monospace;
    background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--fg); outline: none;
  }
  textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 180px; line-height: 1.6; }
  .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 14px 0 0; }
  .actions select { width: auto; font-family: inherit; }
  button {
    font-family: inherit; font-size: 13px; border-radius: 6px; padding: 8px 14px; cursor: pointer;
  }
  .primary { background: var(--fg); color: var(--bg); border: 1px solid var(--fg); }
  .primary:hover { opacity: 0.85; }
  .secondary { background: var(--bg); color: var(--fg); border: 1px solid var(--border); }
  .secondary:hover { background: var(--hover-bg); }
  .status { font-size: 12.5px; color: var(--error); min-height: 18px; margin-top: 8px; }
  .output-block { margin-top: 24px; }
  .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .label-row span.label { font-size: 13px; font-weight: 500; color: var(--muted); }
  pre {
    background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; font-size: 13px; overflow: auto; max-height: 420px;
    white-space: pre-wrap; word-break: break-word; font-family: "SF Mono", Consolas, monospace; line-height: 1.6;
  }
  footer { padding: 20px 0 60px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--border); }
  footer a:hover { color: var(--fg); }
</style>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/theme.css">
  <!-- Google -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8492689719510253"
     crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-K5JHB57W"></script>
</head>
<body>
<div class="wrap">
  <header>
    <a href="/">← 回首页</a>
    <h1>JSON 格式化</h1>
    <p>把 JSON 格式化或压缩，方便查看和复制。</p>
  </header>

  <main>
    <label for="input">输入 JSON</label>
    <textarea id="input" placeholder='{"name":"小兴365","tools":5}' spellcheck="false"></textarea>

    <div class="actions">
      <select id="indent" aria-label="缩进">
        <option value="2">缩进 2 空格</option>
        <option value="4">缩进 4 空格</option>
      </select>
      <button type="button" class="primary" id="formatBtn">格式化</button>
      <button type="button" class="secondary" id="minifyBtn">压缩成一行</button>
      <button type="button" class="secondary" id="clearBtn">清空</button>
    </div>
    <div class="status" id="status"></div>

    <div class="output-block">
      <div class="label-row">
        <span class="label">结果</span>
        <button type="button" class="secondary" id="copyBtn">复制</button>
      </div>
      <pre id="output">等待输入…</pre>
    </div>
  </main>

  <footer>
    工具由 <a href="https://xiaoxing365.com/">小兴365</a> 维护 · <a href="/">回首页</a>
  </footer>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var inputEl = $('input'), indentEl = $('indent'), outputEl = $('output'), statusEl = $('status');

  function render(space) {
    var raw = inputEl.value.trim();
    statusEl.textContent = '';
    if (!raw) {
      outputEl.textContent = '等待输入…';
      return;
    }
    try {
      var value = JSON.parse(raw);
      outputEl.textContent = JSON.stringify(value, null, space);
    } catch (e) {
      outputEl.textContent = '';
      statusEl.textContent = 'JSON 解析失败：' + (e.message || '格式不正确');
    }
  }

  $('formatBtn').addEventListener('click', function () { render(Number(indentEl.value)); });
  $('minifyBtn').addEventListener('click', function () { render(0); });
  indentEl.addEventListener('change', function () {
    if (outputEl.textContent !== '等待输入…' && !statusEl.textContent) render(Number(indentEl.value));
  });
  $('clearBtn').addEventListener('click', function () {
    inputEl.value = '';
    outputEl.textContent = '等待输入…';
    statusEl.textContent = '';
    inputEl.focus();
  });

  $('copyBtn').addEventListener('click', function () {
    var btn = this;
    var text = outputEl.textContent;
    if (!text || text === '等待输入…') return;
    function done() {
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制'; }, 1500);
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else fallback();
  });
})();
</script>
</body>
</html>
