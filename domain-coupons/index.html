<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>域名注册商优惠码 - 小兴365</title>
<meta name="description" content="国外域名注册商的长期优惠码，支持按后缀、国家、平台和优惠幅度筛选，区分注册与续费。">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .filters label { margin-top: 0; }
  .result-bar {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-top: 22px; font-size: 12.5px; color: var(--muted);
  }
  .coupon-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px; margin-top: 12px;
  }
  .coupon-card {
    display: flex; flex-direction: column; gap: 11px;
    padding: 18px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--code-bg);
  }
  .coupon-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .platform { font-size: 15px; font-weight: 700; line-height: 1.4; }
  .platform small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .type-badge {
    font-size: 11px; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .type-badge.renew { background: rgba(16, 185, 129, .12); color: #059669; }
  .code-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 12px; background: var(--surface); border: 1px dashed var(--border); border-radius: 9px;
  }
  .code {
    font-family: "SF Mono", Consolas, monospace; font-size: 17px; font-weight: 700;
    letter-spacing: .6px; color: var(--accent); overflow-wrap: anywhere;
  }
  .metrics { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
  .metrics b { color: var(--fg); font-weight: 600; }
  .coupon-note { font-size: 12px; color: var(--muted); line-height: 1.65; flex: 1; }
  .card-link {
    font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 600;
  }
  .card-link:hover { text-decoration: underline; }
  .empty { padding: 44px 0; text-align: center; color: var(--muted); font-size: 14px; }
  @media (max-width: 560px) {
    .filters { grid-template-columns: 1fr; }
    .coupon-grid { grid-template-columns: 1fr; }
  }
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8492689719510253"
     crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">
  <header>
    <a href="/">← 回首页</a>
    <h1>域名注册商优惠码</h1>
    <p>只收录国外注册商。长期码优先，月度码和限时码会明确标注，按后缀、国家、平台、优惠幅度筛选。</p>
  </header>

  <main>
    <div class="filters">
      <div>
        <label for="q">关键词</label>
        <input type="text" id="q" placeholder="平台 / 优惠码 / 备注，如 COM67、Spaceship" autocomplete="off">
      </div>
      <div>
        <label for="tld">后缀</label>
        <select id="tld"><option value="">全部后缀</option></select>
      </div>
      <div>
        <label for="country">国家/地区</label>
        <select id="country"><option value="">全部国家</option></select>
      </div>
      <div>
        <label for="platform">平台</label>
        <select id="platform"><option value="">全部平台</option></select>
      </div>
      <div>
        <label for="type">优惠类型</label>
        <select id="type">
          <option value="">注册 + 续费</option>
          <option value="注册">只看注册</option>
          <option value="续费">只看续费</option>
        </select>
      </div>
      <div>
        <label for="discount">优惠幅度</label>
        <select id="discount">
          <option value="0">不限幅度</option>
          <option value="10">10% 以上</option>
          <option value="30">30% 以上</option>
          <option value="50">50% 以上</option>
        </select>
      </div>
    </div>

    <div class="result-bar">
      <span id="count"></span>
      <span>数据核对：2026-11-21 · 优惠码可能失效，以结账页为准</span>
    </div>

    <div class="coupon-grid" id="results"></div>
    <p class="empty" id="empty" hidden>没有符合条件的优惠码，换个筛选试试。</p>

    <div class="note">
      说明：这里的「长期」指官方或价格跟踪站未标注固定结束日期，不代表永久有效；优惠码多为首年或限量，续费价请一定单独确认。
      Cloudflare Registrar、Porkbun 等平台主要靠常驻低价而不是优惠码，本表只收录真正支持优惠码的平台。
    </div>
  </main>

  <footer>
    工具由 <a href="https://xiaoxing365.com/">小兴365</a> 维护 · <a href="/">回首页</a>
  </footer>
</div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var coupons = Array.isArray(window.DOMAIN_COUPONS) ? window.DOMAIN_COUPONS : [];
  var $ = function (id) { return document.getElementById(id); };

  function unique(values) {
    var seen = {};
    return values.filter(function (v) {
      if (!v || seen[v]) return false;
      seen[v] = true;
      return true;
    });
  }

  function fillSelect(id, values, allLabel) {
    var select = $(id);
    values.sort().forEach(function (value) {
      var option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });
  }

  var tlds = [];
  coupons.forEach(function (item) { tlds = tlds.concat(item.tlds || []); });
  fillSelect('tld', unique(tlds), '全部后缀');
  fillSelect('country', unique(coupons.map(function (c) { return c.country; })), '全部国家');
  fillSelect('platform', unique(coupons.map(function (c) { return c.platform; })), '全部平台');

  function filtered() {
    var q = $('q').value.trim().toLowerCase();
    var tld = $('tld').value;
    var country = $('country').value;
    var platform = $('platform').value;
    var type = $('type').value;
    var min = Number($('discount').value || 0);

    return coupons.filter(function (c) {
      if (tld && (c.tlds || []).indexOf(tld) === -1) return false;
      if (country && c.country !== country) return false;
      if (platform && c.platform !== platform) return false;
      if (type && c.type !== type) return false;
      if (Number(c.discount || 0) < min) return false;
      if (!q) return true;
      var haystack = [c.platform, c.country, c.type, c.code, c.price, c.limit, c.note]
        .concat(c.tlds || []).join(' ').toLowerCase();
      return haystack.indexOf(q) !== -1;
    });
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function createCard(c) {
    var card = el('div', 'coupon-card');

    var head = el('div', 'coupon-head');
    var title = el('div', 'platform');
    title.appendChild(document.createTextNode(c.platform));
    var sub = el('small', '', c.country + ' · ' + (c.tlds || []).join(' / ') + ' · ' + c.validity);
    title.appendChild(sub);
    head.appendChild(title);
    var badge = el('span', 'type-badge' + (c.type === '续费' ? ' renew' : ''), c.type);
    head.appendChild(badge);
    card.appendChild(head);

    var codeRow = el('div', 'code-row');
    codeRow.appendChild(el('span', 'code', c.code));
    var copy = el('button', 'copy-btn', '复制');
    copy.type = 'button';
    copy.setAttribute('data-code', c.code);
    codeRow.appendChild(copy);
    card.appendChild(codeRow);

    var metrics = el('div', 'metrics');
    metrics.appendChild(el('span', '', '到手价 '));
    metrics.appendChild(el('b', '', c.price));
    metrics.appendChild(el('span', '', '常规 ' + (c.original || '—')));
    metrics.appendChild(el('span', '', '优惠约 ' + c.discount + '%'));
    card.appendChild(metrics);

    card.appendChild(el('div', 'coupon-note', (c.limit ? '限制：' + c.limit + '。' : '') + (c.note || '')));

    var link = el('a', 'card-link', '打开官网 →');
    link.href = c.link;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    card.appendChild(link);
    return card;
  }

  function render() {
    var list = filtered();
    var results = $('results');
    results.textContent = '';
    list.forEach(function (c) { results.appendChild(createCard(c)); });

    var reg = list.filter(function (c) { return c.type === '注册'; }).length;
    var renew = list.filter(function (c) { return c.type === '续费'; }).length;
    $('count').textContent = '共 ' + list.length + ' 条：注册 ' + reg + ' · 续费 ' + renew;
    $('empty').hidden = list.length !== 0;
  }

  ['q', 'tld', 'country', 'platform', 'type', 'discount'].forEach(function (id) {
    $(id).addEventListener('input', render);
    $(id).addEventListener('change', render);
  });

  $('results').addEventListener('click', function (e) {
    var btn = e.target.closest('.copy-btn');
    if (!btn) return;
    var text = btn.getAttribute('data-code');
    function done() {
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制'; }, 1500);
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (err) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else fallback();
  });

  render();
})();
</script>
</body>
</html>
