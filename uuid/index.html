<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID 生成器 - 小兴365</title>
<meta name="description" content="批量生成 UUID v4">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/theme.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8492689719510253"
     crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">
  <header>
    <a href="/">← 回首页</a>
    <h1>UUID 生成器</h1>
    <p>批量生成 UUID v4</p>
  </header>
  <main>
    <label for="countInput">生成数量（1-100）</label>
    <input type="number" id="countInput" value="5" min="1" max="100">
    <div class="actions">
      <button type="button" class="primary" id="genBtn">生成</button>
    </div>
    <div class="status" id="status"></div>

    <div class="output">
      <div class="label-row">
        <span class="label">生成结果</span>
        <button type="button" class="copy-btn" id="copyBtn">复制</button>
      </div>
      <textarea id="output" readonly placeholder="生成的 UUID 会显示在这里，每行一个"></textarea>
    </div>
    <p class="hint">优先使用浏览器原生 crypto.randomUUID()，不可用时用 crypto.getRandomValues 生成。</p>
  </main>
  <footer>
    工具由 <a href="https://xiaoxing365.com/">小兴365</a> 维护 · <a href="/">回首页</a>
  </footer>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var countInput = $('countInput'), genBtn = $('genBtn');
  var statusEl = $('status'), outputEl = $('output'), copyBtn = $('copyBtn');

  function uuidv4() {
    if (window.crypto && typeof crypto.randomUUID === 'function') {
      return crypto.randomUUID();
    }
    if (!window.crypto || typeof crypto.getRandomValues !== 'function') {
      throw new Error('当前浏览器不支持安全随机数生成');
    }
    var bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    var hex = '';
    for (var i = 0; i < 16; i++) {
      hex += ('0' + bytes[i].toString(16)).slice(-2);
    }
    return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) +
      '-' + hex.slice(16, 20) + '-' + hex.slice(20);
  }

  function generate() {
    statusEl.textContent = '';
    outputEl.value = '';
    var n = parseInt(countInput.value, 10);
    if (isNaN(n)) { statusEl.textContent = '请输入有效的数量'; return; }
    if (n < 1 || n > 100) { statusEl.textContent = '数量需在 1 到 100 之间'; return; }
    try {
      var list = [];
      for (var i = 0; i < n; i++) list.push(uuidv4());
      outputEl.value = list.join('\n');
    } catch (e) {
      statusEl.textContent = '生成失败：' + (e.message || '未知错误');
    }
  }

  genBtn.addEventListener('click', generate);

  copyBtn.addEventListener('click', function () {
    var text = outputEl.value;
    if (!text) return;
    function done() {
      copyBtn.textContent = '已复制';
      setTimeout(function () { copyBtn.textContent = '复制'; }, 1500);
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }
  });
})();
</script>
</body>
</html>
